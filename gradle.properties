# ---------------------------------------------------------------------------
# JVM / Gradle daemon
# ---------------------------------------------------------------------------
# AGP 8.6 需要 JDK 17，这里显式钉住安装路径，避免用到机器上的更高版本。
org.gradle.java.home=D:/Program Files/Java/jdk-17

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
# 原厂 APK 基于 support library 25.4.0（不是 AndroidX），所以 AndroidX/Jetifier 必须关闭。
android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official
kotlin.incremental=true

# ---------------------------------------------------------------------------
# 备注（历史坑，已规避，无需改配置）
# ---------------------------------------------------------------------------
# 之前用 aapt2 的 "stable ids" 去对齐原厂资源 id 时，aapt2 会生成形如
# "<name>-<n>:/values/values.xml" 的伪路径，Windows 上会抛 InvalidPathException。
# 现在改为「不复刻资源 id、只保证资源名集合一致」，因此那条配置已移除；
# 不要因为看到这个注释又把 stable ids 打开。
