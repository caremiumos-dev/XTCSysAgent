plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// 原厂 APK 里所有 support 库都是 25.4.0。这里强制统一版本，避免传递依赖
// 引入其它版本导致重复类 / 资源 id 漂移。
// ---------------------------------------------------------------------------
configurations.all {
    resolutionStrategy {
        force 'com.android.support:support-annotations:25.4.0'
        force 'com.android.support:support-compat:25.4.0'
        force 'com.android.support:support-core-ui:25.4.0'
        force 'com.android.support:support-core-utils:25.4.0'
        force 'com.android.support:support-fragment:25.4.0'
        force 'com.android.support:support-media-compat:25.4.0'
        force 'com.android.support:support-vector-drawable:25.4.0'
        force 'com.android.support:animated-vector-drawable:25.4.0'
        force 'com.android.support:appcompat-v7:25.4.0'
        force 'com.android.support:support-v4:25.4.0'
        force 'com.android.support:support-v13:25.4.0'
        force 'com.android.support:exifinterface:25.4.0'

        force 'com.squareup.okhttp3:okhttp:3.12.0'
        force 'com.squareup.okio:okio:1.15.0'
    }
}

android {
    namespace 'com.xtc.systemagent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.xtc.systemagent'
        minSdk 19
        targetSdk 25
        versionCode 24261
        versionName '2.4.27.AW_SysAgent_J100_G97de394'
        // 原厂 APK 是单 dex（classes.dex ≈ 5.1 MB / 4000+ 类），没有 multidex 运行时。
        // 本工程方法总数约 4.1 万（< 64K 上限），因此同样走单 dex：
        // 这样 API 19 上不需要 MultiDex.install()，也不会出现多 dex 拆分带来的兼容风险。
        multiDexEnabled false
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        incremental true
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled false
            shrinkResources false
            // 系统应用使用平台签名，由 scripts/sign-system.ps1 处理。
            signingConfig null
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 原厂 APK 内含 com.xtc.systemagent.BuildConfig，且部分逻辑读取
    // APPLICATION_ID / VERSION_NAME，AGP 8 默认不再生成，这里恢复。
    buildFeatures {
        buildConfig true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    // ---------- Android support (与原厂 25.4.0 对齐) ----------
    implementation 'com.android.support:appcompat-v7:25.4.0'
    implementation 'com.android.support:support-v4:25.4.0'
    implementation 'com.android.support:support-compat:25.4.0'
    implementation 'com.android.support:support-core-ui:25.4.0'
    implementation 'com.android.support:support-core-utils:25.4.0'
    implementation 'com.android.support:support-fragment:25.4.0'
    implementation 'com.android.support:support-media-compat:25.4.0'
    implementation 'com.android.support:support-vector-drawable:25.4.0'
    implementation 'com.android.support:animated-vector-drawable:25.4.0'

    // ---------- 网络 ----------
    implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    implementation 'com.squareup.okio:okio:1.15.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava:2.9.0'

    // ---------- 序列化 ----------
    implementation 'com.google.code.gson:gson:2.8.9'
    // 原厂只用到 jackson-core 的流式 API（META-INF/services 里只有 JsonFactory / ObjectCodec），
    // 没有 databind。databind 会多带 400+ 个类，直接把 dex 顶到 65K 方法上限之上，故不引入。
    implementation 'com.fasterxml.jackson.core:jackson-core:2.9.10'

    // ---------- 响应式 ----------
    implementation 'io.reactivex:rxjava:1.3.8'
    implementation 'io.reactivex:rxandroid:1.2.1'

    // ---------- 数据库 ----------
    implementation 'com.j256.ormlite:ormlite-core:5.1'
    implementation 'com.j256.ormlite:ormlite-android:5.1'

    // ---------- 七牛上传 ----------
    implementation 'com.qiniu:qiniu-android-sdk:7.3.13'

    // ---------- MVP ----------
    implementation 'com.hannesdorfmann.mosby:mvp:2.0.1'
}
